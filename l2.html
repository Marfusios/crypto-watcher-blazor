    <title>CryptoWatcher</title>
    <base href="/" />
    <script>
        // Apply theme and sidebar state before the first paint, Blazor toggles them via window.cw
        (function () {
            var root = document.documentElement;
            var read = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
            var write = function (key, value) { try { localStorage.setItem(key, value); } catch (e) { } };
            var isMobile = function () { return window.innerWidth < 640; };
            var setTheme = function (theme) {
                root.dataset.theme = theme;
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.content = theme === 'light' ? '#ffffff' : '#0c0f13';
            };

            setTheme(read('cw-theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
            root.dataset.sidebar = isMobile() ? 'collapsed' : (read('cw-sidebar') || (window.innerWidth < 1024 ? 'collapsed' : 'expanded'));

            window.cw = {
                toggleTheme: function () {
                    var theme = root.dataset.theme === 'light' ? 'dark' : 'light';
                    setTheme(theme);
                    write('cw-theme', theme);
                },
                toggleSidebar: function () {
                    var state = root.dataset.sidebar === 'collapsed' ? 'expanded' : 'collapsed';
                    root.dataset.sidebar = state;
                    if (!isMobile()) write('cw-sidebar', state);
                },
                closeSidebarOnMobile: function () {
                    if (isMobile()) root.dataset.sidebar = 'collapsed';
                }
            };
        })();
    </script>
